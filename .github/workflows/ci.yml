# N59 — the first thing in this repo that runs the tests without a human remembering to.
#
# WHY IT EXISTS. `main` has shipped RED twice in one week, both times unnoticed for hours:
# `packages/lib/src/store-slug.test.ts` from #157 until #168, and `apps/admin/lib/seller-entity-links.test.ts`
# from `e6d557e` until somebody happened to run the full suite. Nothing blocked either merge, because
# nothing ran. See `specs/docs/tasks/2026-08-06-alerting-gaps.md` ⓐ.
#
# The recipient is whoever opens the PR, and the place they will certainly see it is the PR's own
# status check — the rule this repo keeps relearning: an alarm nobody reads is an alarm that is off.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: the answer that matters is the one about the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · astro check · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ⚠️ THE DATABASE IS NOT OPTIONAL HERE, AND THAT IS THE WHOLE POINT.
    #
    # `test/db-setup.ts` derives `<DATABASE_URL>_test`, creates it and migrates it to head. Without a
    # database it prints a banner and exits 0 — which is exactly how 22 ledger tests (the code that
    # decides when a sale becomes withdrawable) went unrun for months. `TEST_DB_REQUIRED=1` below
    # turns that skip into a failure.
    #
    # postgres:16 matches `docker-compose.coolify.yml`; the superuser is needed because db-setup
    # connects to /postgres and issues CREATE DATABASE.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tokophi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The suites run against `tokophi_test`, derived from this. The name MUST end in `_test` or
      # db-setup refuses — the guard that keeps these write-and-rollback suites off a shared database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokophi
      TEST_DB_REQUIRED: "1"

    steps:
      # ⚠️ `fetch-depth: 0` IS LOAD-BEARING, and it is here for exactly one check.
      #
      # `verify-migrations` check 4 replays EVERY past revision of `packages/db/drizzle/meta/_journal.json`
      # in this history and fails on a tag that has quietly gone missing — the class that swallowed
      # `0046_good_dust` (production never created `kelurahan`, every checkout's ongkir 500'd) and
      # renumbered `0064_store_public_email` away. Checks 1–3 read the journal against itself and are
      # structurally blind to it.
      #
      # On the default shallow clone that check does not FAIL, it goes VACUOUS: measured on a
      # `--depth 1` clone of this repo, `git log HEAD -- <journal>` returns **1** revision (the
      # boundary commit), so "every tag ever recorded" equals "every tag today" and nothing can ever
      # be missing. A check that cannot go red is decoration — the thing this workflow exists to stop.
      # The whole history costs 17,9 MiB (`git count-objects -vH`), which is not worth trading for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 — what the repo is developed on (v24.16.0) and what the Dockerfiles build with.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # ⚠️ npm 11 does NOT run a dependency's install script unless it has been approved, and the
      # FLAG form (`npm ci --allow-scripts <pkg>`) is refused outright in a project-scoped install —
      # measured on the first run of this workflow: `EALLOWSCRIPTS … Add the entries to the
      # "allowScripts" field in package.json, or to .npmrc, instead.` So the approval lives in
      # `package.json`, written by `npm approve-scripts unrs-resolver` rather than by hand.
      #
      # Exactly one package in this lockfile has an install script: `unrs-resolver` (postinstall
      # fetches its platform napi binary, used by the ESLint import resolver). It is approved BY NAME
      # AND VERSION (`unrs-resolver@1.12.2`) — npm pins it deliberately, so a version bump re-gates
      # the script and someone has to look again. That is the feature, not friction: if a bump ever
      # makes this warn, re-approve it consciously.
      #
      # Plain `npm ci` here — NOT `--strict-allow-scripts`. A new dependency arriving with an
      # unapproved script would then fail THIS step, i.e. a PR going red for a reason that has
      # nothing to do with it, which is how people learn to ignore a check.
      - run: npm ci

      # ── N61 ①: the migration journal, BEFORE anything touches a database ───────────────────────
      #
      # It is the only thing that catches two branches both numbering their migration `0064`, and a
      # `when` stamp that does not increase — which makes drizzle SKIP a migration **while printing
      # "migrations applied successfully"**. Both have happened here.
      #
      # It runs FIRST on purpose. `test/db-setup.ts` migrates `tokophi_test` with these very files, so
      # a broken journal fails `npm test` further down in a shape that reads like a test bug. Answer
      # the cheap question (~1 s, no database, no network) before spending 20 minutes on the dear one.
      #
      # ⚠️ NOTE ON THE OLD REASON THIS WAS EXCLUDED, which said the `packages/db` scripts "load `.env`
      # through dotenv, which does not exist on a runner". Measured, that is not what dotenv-cli does:
      # a `-e` file it cannot find is skipped silently (exit 0), and a key already in the environment
      # is NOT overridden — so `DATABASE_URL` from the job env above wins, and no fake `.env` has to be
      # manufactured on the runner. The scripts needed no env plumbing at all. Kept as a note because
      # the next person will otherwise re-derive the same wrong reason from the same script line.
      - run: npm run verify-migrations -w @tokophi/db

      # `npm test` = vitest run && astro check (storefront) && astro check (landing). The astro half
      # is load-bearing: `SectionRenderer`'s exhaustiveness assertion is only compiled by `astro
      # check`, and for a long time nothing ran it, so that guard was decoration.
      #
      # ⚠️ It is ALSO what creates and migrates `tokophi_test` (`test/db-setup.ts`, and with
      # `TEST_DB_REQUIRED=1` a failure to do so is fatal rather than a skip). The three N61 ② steps
      # below depend on that side effect — keep them AFTER this one.
      - run: npm test

      # ── N61 ②: RLS, against the database `npm test` just migrated ──────────────────────────────
      #
      # `verify-rls` is the gate that sat RED for weeks — its own fixture used the `stores LIMIT 1`
      # bug, so it compared an empty store's rows against global totals and failed forever. Nobody
      # read it, and **both cross-tenant leaks fixed in 0058 shipped past it while it was already
      # failing**. An alarm that is always on is an alarm that is off; an alarm nobody starts is the
      # same thing with fewer steps.
      #
      # Both scripts need the non-owner role `tokophi_app` — created by migration `0012_tenant_rls`
      # (a `DO $$ … IF NOT EXISTS … CREATE ROLE` block), so a migrated database has it and nothing
      # extra has to be provisioned on the runner. Verified on a throwaway postgres:16.
      #
      # ⚠️ `_test`, not `tokophi`: the job-level `DATABASE_URL` names the database db-setup DERIVES the
      # test one from, and that base database is created empty by the service container and never
      # migrated. Pointing these at it would fail on `relation "stores" does not exist`.
      # 🔴 `SEED_FORCE` IS WHAT MAKES THIS STEP DO ANYTHING AT ALL, AND WITHOUT IT THE WORKFLOW WAS
      # RED BY CONSTRUCTION — measured 2026-08-20 by executing this file step for step against a
      # fresh postgres, because GitHub Actions itself has not run since the account's billing failed.
      #
      # `npm test` above does not only migrate `tokophi_test`; several suites INSERT accounts, stores
      # and orders through the owner connection and never roll them back (they are throwaway rows in
      # a throwaway database). So by the time this step runs the database is NOT empty — and the seed
      # answers "DB already has data — skipping seed" and **EXITS 0**. Silently. Nothing is seeded,
      # `store_domains` stays empty, and four steps later the storefront suite dies with *"never
      # served a 200 for Host toko-demo.test … If that host resolves to no store, no check below
      # could have meant anything."* The step that was added to make `check-hero-srcset` green was
      # itself a no-op.
      #
      # ⚠️ `SEED_DESTROY_CONFIG` IS THE SECOND KEY ON PURPOSE and it belongs ONLY here. It exists to
      # stop somebody truncating config-bearing rows (encrypted CAPI tokens, gateway credentials,
      # operator logins) out of a SHARED database — see AGENTS.md. On this runner the database is an
      # ephemeral service container that dies with the job, so forcing is not a risk, it is the only
      # way to get a deterministic fixture. **Never copy this pair into a script that can reach the
      # shared dev database or production.**
      - name: seed tokophi_test (the RLS verifiers assert over rows, not just the catalog)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokophi_test
          SEED_FORCE: "1"
          SEED_DESTROY_CONFIG: "1"
        run: npm run seed -w @tokophi/db

      # ⚠️ `seed.ts` writes NO `page_templates` — the deploy chain runs `seed-templates.ts` right
      # after it (docker-compose.coolify.yml), and the storefront verify suite below needs what that
      # second script creates: a default homepage carrying the batik HERO. Without it
      # `check-hero-srcset` finds `hero imgs: []` and fails **by construction**, on every run,
      # forever — the "red on clean data" shape this repo has already paid for twice. Measured
      # 2026-08-19: seed-only → 1 of 6 red; + this step → all 6 green.
      # Needs the store the step above creates, so it inherits that step's determinism. It has no
      # skip-guard of its own: pointed at a database with no demo store it simply writes nothing.
      - name: seed store templates (the hero the srcset checks measure)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokophi_test
        run: npm run seed:templates -w @tokophi/db

      # Browser-driven storefront performance/responsive-image gates: builds, starts ONE storefront,
      # runs all six registered checks. Two requirements this step's FIRST placement ignored (it ran
      # right after `npm test`, against the job-level DATABASE_URL — the empty, never-migrated base
      # `tokophi` — so every route 500'd on `relation "store_domains" does not exist`, exactly the
      # failure the `_test, not tokophi` warning above already named; main sat red 2026-08-15/16):
      #   1. a MIGRATED **and SEEDED** database — `tokophi_test`: `npm test` migrates it, the seed
      #      step directly above populates it (`toko-demo.test` itself is a `store_domains` row);
      #   2. a BROWSER — four of the six checks drive chromium, and the runner image ships none.
      #      `--with-deps` because headless chromium's shared libraries are not guaranteed either.
      - name: install chromium for the storefront checks
        run: npx playwright install --with-deps chromium
      - name: storefront verify suite (6 browser/HTTP checks)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokophi_test
        run: npm run verify -w @tokophi/storefront

      # Isolation proved as SQL: coverage over every store-scoped table, `stores` itself (the blind
      # spot 0058 closed), fail-closed with no GUC, WITH CHECK on a cross-tenant write, and the
      # un-RLS'd child tables that must stay on a reviewed list.
      - name: verify-rls
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokophi_test
        run: npm run verify-rls -w @tokophi/db

      # The same isolation proved through the code path the admin actually runs — `withTenant()`,
      # i.e. GUC + `SET LOCAL ROLE`, reads AND writes. Different claim, not a duplicate.
      - name: verify-rls-app
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/tokophi_test
        run: npm run verify-rls-app -w @tokophi/db

      # `next build` does not typecheck, and neither does ESLint. Only this does — and it is the guard
      # that caught a 4th read site of `suspendedAt` that a manual grep had missed.
      - run: npx tsc --noEmit
        working-directory: apps/admin
      - run: npx tsc --noEmit
        working-directory: apps/super-admin

# NOT here yet, deliberately:
#   · `npm run lint -w @tokophi/admin` — currently red (itemised in specs/docs/BACKLOG.md). Adding it
#     now would make CI red on day one, which is how a check stops being read. Fix the lint errors,
#     then add the step.
#   · `verify-ledger` (N61) — and this one is a DECISION, not a to-do.
#     ① It answers a question about PRODUCTION DATA: children of `orders` whose parent row is gone,
#       and what they are worth in a merchant's withdrawable balance. Production carried 48 such rows
#       (Rp810.000 sitting in `available`). A freshly seeded `tokophi_test` cannot have any, so the
#       step would be green by construction — the most expensive kind of green there is.
#     ② The half that IS schema-level — the FKs exist, are VALIDATED, and the trigger fires today —
#       already runs here: `packages/db/src/verify-ledger.test.ts` asserts all of it against
#       `tokophi_test` inside `npm test`, including a deliberately planted orphan. A CI step would
#       duplicate a check that already runs and answer nothing the tests do not.
#     ③ It is NOT read-only, whatever the file header says: `refusesDanglingInsert` opens a write
#       transaction (account + store + a dangling ledger row) that always rolls back. Safe against
#       production, and confirmed so on 2026-08-05 — but it is not something to fire per PR.
#     PROPOSED instead: a weekly `schedule:` workflow running it against production, with the
#     credential from a repository secret. Not added here — it needs a secret this branch cannot
#     create, and slipping a production-touching job into a PR-gate workflow is how the two get
#     confused later. Filed for NEXT.md (its N61 entry already asks for exactly this cron).
