# Static server for apps/docs (Panduan TokoΦ). TLS ends at Cloudflare/Traefik; this is plain HTTP.
server {
  listen 4339;
  root /usr/share/nginx/html;
  # Relative redirects (/mulai → /mulai/): an absolute one would name this container's port.
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  error_page 404 /404.html;
  location / { try_files $uri $uri/ =404; }
  # Hashed build assets never change under the same name.
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /404.html { internal; }
}
