# Local dev database — plain PostgreSQL 16 (matches the self-hosted Postgres (VPS) target in docs/SCHEMA.md).
# Start:  docker compose up -d db      Stop: docker compose stop db      Reset: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    container_name: tokophi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokophi
      POSTGRES_PASSWORD: tokophi
      POSTGRES_DB: tokophi
    ports:
      - "5433:5432" # host 5433 → avoids clashing with any local 5432
    volumes:
      - tokophi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokophi -d tokophi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tokophi-pgdata:
