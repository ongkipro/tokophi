# TokoΦ — full stack for Coolify (Docker Compose build pack).
# Postgres + one-off migrate/seed + 3 apps. Secrets/URLs come from Coolify env (UI) with dev
# defaults here. Ports are `expose` only — Coolify's proxy assigns a domain per service.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokophi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokophi}
      POSTGRES_DB: tokophi
    volumes:
      - tokophi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokophi -d tokophi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # one-off: apply Drizzle migrations + seed, then exit (reuses the admin image, which has
  # drizzle-kit + tsx + packages/db source). Apps wait for this to finish successfully.
  migrate:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # ⚠️ THE SAME VOLUME THE ADMIN SERVES `/api/uploads/` FROM — required, not tidiness.
      # `seed-journal.ts` writes 15 WebP files AND inserts the `media` rows that point at them. This
      # container is `restart: "no"`: without the mount it would write those files into its own
      # ephemeral filesystem, exit, and take them with it — leaving 15 media rows and 15 articles
      # referencing images that 404 on the storefront, while the deploy log said the journal seeded
      # fine. A seed that writes FILES must mount the volume those files live on.
      - tokophi-uploads:/app/apps/admin/public/uploads
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
    # `seed.ts` is a NO-OP on a live DB — it counts `stores` and skips when any exist, so a redeploy
    # never touches real orders/invoices/uploads. `seed-templates.ts` has the same shape (it inserts
    # only when the store has no homepage template) and has to be here for a reason worth stating:
    # the demo's batik homepage now lives in `page_templates` as SELLER data, not hard-coded in the
    # platform. Without this line a deploy would serve batik-nusantara the NEUTRAL fallback — correct
    # for a store that has built nothing, wrong for the one that has. Both are idempotent, so ordering
    # after `seed.ts` just means the store exists before we look for its template.
    command: >
      sh -c "cd packages/db &&
      npx drizzle-kit migrate &&
      npx tsx src/seed.ts &&
      (npx tsx src/seed-templates.ts || echo 'templates seed skipped') &&
      (npx tsx src/seed-journal.ts || echo 'journal seed skipped') &&
      (npx tsx src/seed-taxonomy.ts || echo 'taxonomy seed skipped') &&
      (npx tsx src/seed-products.ts || echo 'products seed skipped') &&
      (npx tsx src/seed-demo-ratings.ts || echo 'demo-ratings seed skipped') &&
      (npx tsx src/seed-areas.ts || echo 'areas seed skipped')"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes:
      # persist uploaded media across redeploys (next start runs from /app/apps/admin)
      - tokophi-uploads:/app/apps/admin/public/uploads
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me}
      KIRIMINAJA_ENV: ${KIRIMINAJA_ENV:-sandbox}
      KIRIMINAJA_API_KEY: ${KIRIMINAJA_API_KEY:-}
      KIRIMINAJA_ORDER_PREFIX: ${KIRIMINAJA_ORDER_PREFIX:-}
      AUTOLARIS_BASE: ${AUTOLARIS_BASE:-https://api-h2h.autolaris.com}
      AUTOLARIS_API_KEY: ${AUTOLARIS_API_KEY:-}
      AUTOLARIS_CALLBACK_SECRET: ${AUTOLARIS_CALLBACK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # ADR 0012 — encrypts the merchants' own CAPI tokens at rest. WITHOUT IT THE FEATURE IS DEAD ON
      # ARRIVAL, and silently so: the Seller's save is refused with "Kunci enkripsi belum diset" (we
      # never store a token in plaintext), so server-side conversions can never be switched on and
      # every prepaid order records no Purchase at all. Setting it in Coolify is not enough — a var
      # only reaches a service if this block forwards it.
      INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY:-}
      # Optional: pins Meta's Graph version (defaults to a pinned one in lib/capi.ts).
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # CNAME target a merchant points their custom domain at (Pengaturan → Domain). Defaults to
      # ⚠️ The fallback was cname.tokophi.COM until 2026-08-08 and that was WRONG: Cloudflare-for-SaaS
      # runs on the tokophi.cc zone. Coolify overrides this var, so nothing was broken in production —
      # but if the override ever went missing the app would silently advertise a target that can never
      # validate, and merchants would follow it. A wrong default is a bug waiting for a config gap.
      # only if the platform ever moves the target off that label. See specs/docs/CUSTOM_DOMAIN.md.
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-cname.tokophi.cc}
      # ── Self-serve signup master switch (apps/admin/lib/provision.ts `signupOpen()`) ────────────
      # It was NOT forwarded here, so `SIGNUP_ENABLED=true` set in Coolify reached nothing and
      # `/daftar` stayed shut with no error to explain why — `.env.coolify.example` told the operator
      # to set it and redeploy, and this file silently won. Verified against the running container on
      # 2026-08-05: `SIGNUP_ENABLED` was absent from its environment entirely.
      #
      # ⚠️ The default stays EMPTY, so it keeps failing CLOSED. Opening public registration is a
      # deliberate act — set the value in Coolify, do not change the default here.
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-}
      # Google sign-in on /daftar and /login. Also never forwarded, so `googleEnabled()` is false in
      # production and the "Daftar dengan Google" button is hidden however SIGNUP_ENABLED is set —
      # password signup would work and Google would not, which reads as a broken button, not a
      # disabled feature. Empty = the button stays hidden, which is the honest default.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  super-admin:
    build:
      context: .
      dockerfile: apps/super-admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me}
      ADMIN_URL: ${ADMIN_URL:-}
      KIRIMINAJA_ENV: ${KIRIMINAJA_ENV:-sandbox}
      KIRIMINAJA_API_KEY: ${KIRIMINAJA_API_KEY:-}
      AUTOLARIS_BASE: ${AUTOLARIS_BASE:-https://api-h2h.autolaris.com}
      AUTOLARIS_API_KEY: ${AUTOLARIS_API_KEY:-}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
      PUBLIC_ONGKIR_API: ${PUBLIC_ONGKIR_API:-}
      PUBLIC_ORDER_API: ${PUBLIC_ORDER_API:-}
      # Host-header multi-tenant (ADR 0009): `<slug>.tokophi.com` → that store. RESERVED labels
      # (www/app/rich/admin/api/cname/toko/…) never resolve as a slug. STORE_SLUG stays the
      # fallback for hosts that name no store (bare IP, toko.tokophi.com, localhost).
      STOREFRONT_BASE_DOMAIN: ${STOREFRONT_BASE_DOMAIN:-}
      STORE_SLUG: ${STORE_SLUG:-batik-nusantara}
    expose:
      - "4327"
    labels:
      # Coolify generates a router per configured domain; a WILDCARD host needs its own rule.
      # The original Host header must reach the app untouched — the tenant is read from it.
      # TLS = the Cloudflare Origin CA default cert (proxy/dynamic/tokophi-origin-tls.yaml):
      # Let's Encrypt cannot issue a wildcard over HTTP-01, so no certresolver here.
      - traefik.enable=true
      - traefik.http.routers.tokophi-stores.rule=HostRegexp(`^[a-z0-9-]+\.tokophi\.com$`)
      # ⚠️ PRIORITY IS LOAD-BEARING. This regexp also matches app./rich./toko./www.tokophi.com,
      # and Traefik's DEFAULT priority is the rule's LENGTH — the regexp is longer than
      # Host(`app.tokophi.com`), so without this it would OUTRANK the admin router and serve the
      # storefront on app.tokophi.com. priority=1 = lowest: every explicit Host router wins first,
      # and this catch-all only sees hostnames nothing else claimed.
      - traefik.http.routers.tokophi-stores.priority=1
      - traefik.http.routers.tokophi-stores.entryPoints=https
      - traefik.http.routers.tokophi-stores.tls=true
      - traefik.http.routers.tokophi-stores.middlewares=gzip
      - traefik.http.routers.tokophi-stores.service=tokophi-stores
      - traefik.http.services.tokophi-stores.loadbalancer.server.port=4327
    healthcheck:
      # SSR: starts in seconds (reads catalog from Postgres at boot, no build-at-start).
      # Use 127.0.0.1 (NOT localhost): @astrojs/node binds IPv4 0.0.0.0 only, but busybox wget
      # resolves `localhost` → ::1 (IPv6) first → connection refused → false "unhealthy" → Traefik 404.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4327/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # landing / front door for the apex (tokophi.com + www) — static Astro, currently "segera hadir".
  # Deliberately has NO database and NO depends_on: postgres — the front door must be servable even
  # when everything behind it is down.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    expose:
      - "4328"
    labels:
      # www.tokophi.com → 301 → tokophi.com (path + query preserved). Done here, at the origin,
      # because our Cloudflare token has no ruleset permission (edge Redirect Rules would be the
      # cheaper place). priority 100 > the Coolify-generated routers, so it wins for this host.
      - traefik.enable=true
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https?://www\.tokophi\.com/(.*)
      # NOT `$${1}`: Coolify hands these labels straight to the Docker API without docker-compose's
      # `$$` → `$` unescaping, so `$${1}` reaches Traefik verbatim and it emits a literal `${1}`
      # in the Location header (shipped exactly that way once — https://tokophi.com/${1}).
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://tokophi.com/${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.routers.www-apex.rule=Host(`www.tokophi.com`)
      - traefik.http.routers.www-apex.entryPoints=https
      - traefik.http.routers.www-apex.tls=true
      - traefik.http.routers.www-apex.priority=100
      - traefik.http.routers.www-apex.middlewares=www-to-apex
      - traefik.http.routers.www-apex.service=landing-svc
      - traefik.http.services.landing-svc.loadbalancer.server.port=4328
    healthcheck:
      # 127.0.0.1, not localhost — @astrojs/node binds IPv4 only while busybox wget tries ::1 first
      # (this exact mistake made the storefront report a false "unhealthy" on 2026-07-10).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4328/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # daily billing job — hits the admin cron endpoint (syncs statuses + auto-invoices past-due).
  #
  # Response body to STDOUT (the SAME lesson `cron-tracking` and `cron-tracking-events` already record
  # two blocks below — this one was the last holdout, fixed 2026-08-03). It was
  # `wget -qO- … >/dev/null 2>&1`, which threw away `{stores, statusSynced, invoicesCreated}` — the only
  # numbers the endpoint produces. A run that invoiced NOTHING and a run that invoiced every merchant
  # logged **identically: nothing at all**, so `docker logs cron` was empty on a healthy box and empty
  # on a broken one, and the container being `Up (healthy)` only proves `sh` is alive (the healthcheck
  # is `kill -0 1`). AGENTS.md: *report what you WROTE, never what you were asked to write.*
  # `docker logs cron-…` is now the record.
  #
  # ⚠️ THE SCHEDULE IS THE DEPLOY SCHEDULE, NOT A CLOCK. `sleep 86400` re-anchors to CONTAINER START,
  # so every redeploy restarts the day AND fires a billing run immediately. Measured 2026-08-03: 13
  # deploys that day, 18 on 07-30, 24 on 07-23 — the 86400 has almost never elapsed, and the billing
  # hour is wherever a merge happened to land. **What stops that double-invoicing is a guard in the
  # ROUTE, not here**: it skips any store that already has a `menunggu` subscription invoice
  # (`billing/route.ts`) — measured, ≤1 subscription invoice exists on any day, including the 18-deploy
  # one. That guard is a check-then-act with no lock and no idempotency key, so it holds for SEQUENTIAL
  # re-runs and not for genuinely concurrent ones. A real fixed-clock scheduler + an idempotency key is
  # its own piece of work (DEPLOY.md → "Billing cron"); do not half-build one in this string.
  #
  # 🔔 `CRON_INTERVAL_SEC` IS DECLARED ONCE AND USED TWICE — by `sleep`, and as `?every=` on the URL.
  # The endpoint stores it in `cron_runs` (migration 0091) and Super Admin → Analitik → Sistem derives
  # the "overdue" threshold from it, so the alarm's cadence IS this loop's cadence and cannot drift
  # from it. **Never inline the number back into the command**: two copies is how a panel keeps
  # promising 15 minutes about a loop somebody changed to 5. See `app/api/cron/record-run.ts`.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      admin: { condition: service_healthy }
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_INTERVAL_SEC: 86400
    command: ["sh", "-c", "while true; do echo \"[cron-billing] $$(date -Iseconds)\"; wget -qO- \"http://admin:3000/api/cron/billing?secret=$$CRON_SECRET&every=$$CRON_INTERVAL_SEC\" || echo 'cron billing failed'; echo; sleep $$CRON_INTERVAL_SEC; done"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # tracking poller — pulls KiriminAja, fills orders.awb, advances status to match the courier.
  #
  # Its OWN sidecar, not another line inside `cron` above: that loop sleeps 86400s, and an AWB the
  # shopper is waiting on cannot be a day late. The endpoint shipped complete (db10557) with nothing
  # scheduling it — a poller that never runs is an AWB that never lands, and the rest of the chain
  # queues behind it (Pengiriman Massal has nothing to print until an AWB exists).
  #
  # 15 minutes: a waybill appears when the courier accepts the pickup — minutes to hours, not days.
  # Faster only spends KiriminAja rate limit on orders that have not moved. The sweep is capped at
  # 100 and syncOrderFromKa moves an order FORWARD only, so a missed tick costs a delay, never a
  # wrong state.
  cron-tracking:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      admin: { condition: service_healthy }
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      # 15 minutes — the interval reasoned about above. `sleep` and `?every=` read the SAME variable so
      # the panel's threshold cannot drift from the loop; see the note on the `cron` service.
      CRON_INTERVAL_SEC: 900
    # The response body goes to STDOUT, not /dev/null. It used to be discarded, which meant the run
    # summary the endpoint carefully builds — {scanned, advanced, awbFilled, problems, errors} — was
    # unobservable in production: nobody, human or machine, could tell a healthy sweep from one where
    # `awbFilled` had been 0 for a week. `docker logs cron-tracking` is now the record.
    #
    # ⚠️ A LOG IS NOT AN ALARM. Nobody opens `docker logs` without already suspecting something, which
    # is the whole reason `awbFilled` could sit at 0 for a week: the evidence existed and no one was
    # looking at it. Every tick now also upserts `cron_runs` (0091) and Super Admin → Analitik → Sistem
    # shows "terakhir jalan N menit lalu" in RED past 2 × this interval. Keep both — the log carries the
    # detail, the row is what makes someone go and read it.
    command: ["sh", "-c", "while true; do echo \"[cron-tracking] $$(date -Iseconds)\"; wget -qO- \"http://admin:3000/api/cron/tracking?secret=$$CRON_SECRET&every=$$CRON_INTERVAL_SEC\" || echo 'cron tracking failed'; echo; sleep $$CRON_INTERVAL_SEC; done"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # conversion delivery worker — drains `tracking_event_deliveries` into Meta CAPI / GA4 MP / TikTok
  # Events API (ADR 0012 §0.1). The table IS the queue; this sidecar is the only thing that empties it.
  #
  # 60 seconds, not 900: an ad platform's attribution and its optimisation both degrade with delay, and
  # a purchase is a low-volume, high-value event — the batch is capped at 50 (route.ts BATCH) and a tick with nothing due
  # returns immediately, so a fast interval costs a query, not an API call. Retries carry their own
  # backoff inside the endpoint (~1m → 6h), so this loop never becomes the retry rate.
  #
  # Response body to STDOUT (same lesson as cron-tracking): {claimed, sent, failed, dead} is how anyone
  # tells a healthy queue from one that has been dead-lettering every conversion for a week.
  cron-tracking-events:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      admin: { condition: service_healthy }
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      # 60 seconds — the interval reasoned about above, read by BOTH `sleep` and `?every=`.
      CRON_INTERVAL_SEC: 60
    command: ["sh", "-c", "while true; do wget -qO- \"http://admin:3000/api/cron/tracking-events?secret=$$CRON_SECRET&every=$$CRON_INTERVAL_SEC\" || echo 'cron tracking-events failed'; echo; sleep $$CRON_INTERVAL_SEC; done"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Postgres backup — custom-format dump to a volume.
  #
  # 🔴 THE PREVIOUS SHAPE LOST HISTORY, and it read as if it did not. It dumped IMMEDIATELY on start,
  # then `sleep 86400`, and kept the newest 7 BY COUNT. Every deploy restarts this container — so ten
  # deploys in a day produced ten dumps and `keep-7` evicted every recovery point from every earlier
  # day. Measured on production 2026-08-05: all seven dumps spanned 10:44 → 16:28, i.e. **5 h 44 min**
  # of retention where "daily, keep-7" implies seven days. A data-corrupting change not noticed within
  # ~7 deploys had no clean dump left to restore from. Full reasoning: specs/docs/SLA-DRP.md §3.
  #
  # Three defects, three fixes — do not collapse them back:
  #  1. RESTART-SAFE CADENCE. Dump only if the newest dump is older than 6 h, so a redeploy neither
  #     resets the clock nor manufactures a recovery point. Waking hourly keeps the real interval ≤6 h.
  #  2. RETENTION BY AGE, NOT COUNT (`-mtime +14`). Deploy-triggered dumps can no longer evict a day.
  #     ⚠️ Never put a `keep the newest N` rule back — N files is not N days when restarts write files.
  #  3. ATOMIC WRITE. Dump to `.part`, rename only on success. An interrupted pg_dump used to leave a
  #     truncated `.dump` that looked like a valid recovery point, became "the newest" (suppressing the
  #     next dump), and satisfied the healthcheck.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tokophi}
    volumes:
      - tokophi-backups:/backups
    command:
      - "sh"
      - "-c"
      - |
        while true; do
          rm -f /backups/*.part 2>/dev/null
          newest=$$(ls -1t /backups/*.dump 2>/dev/null | head -1)
          if [ -z "$$newest" ] || [ -z "$$(find "$$newest" -mmin -360 2>/dev/null)" ]; then
            f=/backups/tokophi-$$(date +%Y%m%d-%H%M%S).dump
            if pg_dump -h postgres -U tokophi -d tokophi -Fc -f "$$f.part" && mv "$$f.part" "$$f"; then
              echo backup-ok
            else
              rm -f "$$f.part"; echo backup-FAILED
            fi
          fi
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 3600
        done
    healthcheck:
      # ⚠️ The old test was `ls /backups/*.dump` — it passed if ANY dump existed, including one from six
      # months ago, while its own comment claimed to "double as proof the backup ran". An alarm that
      # cannot fire is an alarm that is off; this repo has paid for that twice (verify-rls, the pixel
      # check). This one goes UNHEALTHY when no dump has landed in 8 h — one missed 6 h cycle plus
      # slack. Nothing `depends_on` this service, so an unhealthy backup blocks no deploy; it is a
      # signal, which is the whole point.
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name '*.dump' -mmin -480 2>/dev/null)\" || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  tokophi-pgdata:
  tokophi-uploads:
  tokophi-backups:
