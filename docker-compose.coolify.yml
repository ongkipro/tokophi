# TokoΦ — full stack for Coolify (Docker Compose build pack).
# Postgres + one-off migrate/seed + 3 apps. Secrets/URLs come from Coolify env (UI) with dev
# defaults here. Ports are `expose` only — Coolify's proxy assigns a domain per service.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokophi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokophi}
      POSTGRES_DB: tokophi
    volumes:
      - tokophi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokophi -d tokophi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # one-off: apply Drizzle migrations + seed, then exit (reuses the admin image, which has
  # drizzle-kit + tsx + packages/db source). Apps wait for this to finish successfully.
  migrate:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
    # `seed.ts` is a NO-OP on a live DB — it counts `stores` and skips when any exist, so a redeploy
    # never touches real orders/invoices/uploads. `seed-templates.ts` has the same shape (it inserts
    # only when the store has no homepage template) and has to be here for a reason worth stating:
    # the demo's batik homepage now lives in `page_templates` as SELLER data, not hard-coded in the
    # platform. Without this line a deploy would serve batik-nusantara the NEUTRAL fallback — correct
    # for a store that has built nothing, wrong for the one that has. Both are idempotent, so ordering
    # after `seed.ts` just means the store exists before we look for its template.
    command: >
      sh -c "cd packages/db &&
      npx drizzle-kit migrate &&
      npx tsx src/seed.ts &&
      (npx tsx src/seed-templates.ts || echo 'templates seed skipped') &&
      (npx tsx src/seed-areas.ts || echo 'areas seed skipped')"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes:
      # persist uploaded media across redeploys (next start runs from /app/apps/admin)
      - tokophi-uploads:/app/apps/admin/public/uploads
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me}
      KIRIMINAJA_ENV: ${KIRIMINAJA_ENV:-sandbox}
      KIRIMINAJA_API_KEY: ${KIRIMINAJA_API_KEY:-}
      KIRIMINAJA_ORDER_PREFIX: ${KIRIMINAJA_ORDER_PREFIX:-}
      AUTOLARIS_BASE: ${AUTOLARIS_BASE:-https://api-h2h.autolaris.com}
      AUTOLARIS_API_KEY: ${AUTOLARIS_API_KEY:-}
      AUTOLARIS_CALLBACK_SECRET: ${AUTOLARIS_CALLBACK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # CNAME target a merchant points their custom domain at (Pengaturan → Domain). Defaults to
      # cname.tokophi.com in code, which is already RESERVED in the storefront host resolver — set here
      # only if the platform ever moves the target off that label. See specs/docs/CUSTOM_DOMAIN.md.
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-cname.tokophi.com}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  super-admin:
    build:
      context: .
      dockerfile: apps/super-admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me}
      ADMIN_URL: ${ADMIN_URL:-}
      KIRIMINAJA_ENV: ${KIRIMINAJA_ENV:-sandbox}
      KIRIMINAJA_API_KEY: ${KIRIMINAJA_API_KEY:-}
      AUTOLARIS_BASE: ${AUTOLARIS_BASE:-https://api-h2h.autolaris.com}
      AUTOLARIS_API_KEY: ${AUTOLARIS_API_KEY:-}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://tokophi:${POSTGRES_PASSWORD:-tokophi}@postgres:5432/tokophi
      PUBLIC_ONGKIR_API: ${PUBLIC_ONGKIR_API:-}
      PUBLIC_ORDER_API: ${PUBLIC_ORDER_API:-}
      # Host-header multi-tenant (ADR 0009): `<slug>.tokophi.com` → that store. RESERVED labels
      # (www/app/rich/admin/api/cname/toko/…) never resolve as a slug. STORE_SLUG stays the
      # fallback for hosts that name no store (bare IP, toko.tokophi.com, localhost).
      STOREFRONT_BASE_DOMAIN: ${STOREFRONT_BASE_DOMAIN:-}
      STORE_SLUG: ${STORE_SLUG:-batik-nusantara}
    expose:
      - "4327"
    labels:
      # Coolify generates a router per configured domain; a WILDCARD host needs its own rule.
      # The original Host header must reach the app untouched — the tenant is read from it.
      # TLS = the Cloudflare Origin CA default cert (proxy/dynamic/tokophi-origin-tls.yaml):
      # Let's Encrypt cannot issue a wildcard over HTTP-01, so no certresolver here.
      - traefik.enable=true
      - traefik.http.routers.tokophi-stores.rule=HostRegexp(`^[a-z0-9-]+\.tokophi\.com$`)
      # ⚠️ PRIORITY IS LOAD-BEARING. This regexp also matches app./rich./toko./www.tokophi.com,
      # and Traefik's DEFAULT priority is the rule's LENGTH — the regexp is longer than
      # Host(`app.tokophi.com`), so without this it would OUTRANK the admin router and serve the
      # storefront on app.tokophi.com. priority=1 = lowest: every explicit Host router wins first,
      # and this catch-all only sees hostnames nothing else claimed.
      - traefik.http.routers.tokophi-stores.priority=1
      - traefik.http.routers.tokophi-stores.entryPoints=https
      - traefik.http.routers.tokophi-stores.tls=true
      - traefik.http.routers.tokophi-stores.middlewares=gzip
      - traefik.http.routers.tokophi-stores.service=tokophi-stores
      - traefik.http.services.tokophi-stores.loadbalancer.server.port=4327
    healthcheck:
      # SSR: starts in seconds (reads catalog from Postgres at boot, no build-at-start).
      # Use 127.0.0.1 (NOT localhost): @astrojs/node binds IPv4 0.0.0.0 only, but busybox wget
      # resolves `localhost` → ::1 (IPv6) first → connection refused → false "unhealthy" → Traefik 404.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4327/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # landing / front door for the apex (tokophi.com + www) — static Astro, currently "segera hadir".
  # Deliberately has NO database and NO depends_on: postgres — the front door must be servable even
  # when everything behind it is down.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    expose:
      - "4328"
    labels:
      # www.tokophi.com → 301 → tokophi.com (path + query preserved). Done here, at the origin,
      # because our Cloudflare token has no ruleset permission (edge Redirect Rules would be the
      # cheaper place). priority 100 > the Coolify-generated routers, so it wins for this host.
      - traefik.enable=true
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https?://www\.tokophi\.com/(.*)
      # NOT `$${1}`: Coolify hands these labels straight to the Docker API without docker-compose's
      # `$$` → `$` unescaping, so `$${1}` reaches Traefik verbatim and it emits a literal `${1}`
      # in the Location header (shipped exactly that way once — https://tokophi.com/${1}).
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://tokophi.com/${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.routers.www-apex.rule=Host(`www.tokophi.com`)
      - traefik.http.routers.www-apex.entryPoints=https
      - traefik.http.routers.www-apex.tls=true
      - traefik.http.routers.www-apex.priority=100
      - traefik.http.routers.www-apex.middlewares=www-to-apex
      - traefik.http.routers.www-apex.service=landing-svc
      - traefik.http.services.landing-svc.loadbalancer.server.port=4328
    healthcheck:
      # 127.0.0.1, not localhost — @astrojs/node binds IPv4 only while busybox wget tries ::1 first
      # (this exact mistake made the storefront report a false "unhealthy" on 2026-07-10).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4328/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # daily billing job — hits the admin cron endpoint (syncs statuses + auto-invoices past-due).
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      admin: { condition: service_healthy }
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command: ["sh", "-c", "while true; do wget -qO- \"http://admin:3000/api/cron/billing?secret=$$CRON_SECRET\" >/dev/null 2>&1 || echo 'cron billing failed'; sleep 86400; done"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # tracking poller — pulls KiriminAja, fills orders.awb, advances status to match the courier.
  #
  # Its OWN sidecar, not another line inside `cron` above: that loop sleeps 86400s, and an AWB the
  # shopper is waiting on cannot be a day late. The endpoint shipped complete (db10557) with nothing
  # scheduling it — a poller that never runs is an AWB that never lands, and the rest of the chain
  # queues behind it (Pengiriman Massal has nothing to print until an AWB exists).
  #
  # 15 minutes: a waybill appears when the courier accepts the pickup — minutes to hours, not days.
  # Faster only spends KiriminAja rate limit on orders that have not moved. The sweep is capped at
  # 100 and syncOrderFromKa moves an order FORWARD only, so a missed tick costs a delay, never a
  # wrong state.
  cron-tracking:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      admin: { condition: service_healthy }
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command: ["sh", "-c", "while true; do wget -qO- \"http://admin:3000/api/cron/tracking?secret=$$CRON_SECRET\" >/dev/null 2>&1 || echo 'cron tracking failed'; sleep 900; done"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # daily Postgres backup — custom-format dump to a volume, keeps the last 7.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-tokophi}
    volumes:
      - tokophi-backups:/backups
    command: ["sh", "-c", "while true; do pg_dump -h postgres -U tokophi -d tokophi -Fc -f /backups/tokophi-$$(date +%Y%m%d-%H%M%S).dump && echo backup-ok; ls -1t /backups/*.dump 2>/dev/null | tail -n +8 | xargs -r rm -f; sleep 86400; done"]
    healthcheck:
      # healthy only once at least one dump exists → doubles as proof the backup ran
      test: ["CMD-SHELL", "ls /backups/*.dump >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  tokophi-pgdata:
  tokophi-uploads:
  tokophi-backups:
